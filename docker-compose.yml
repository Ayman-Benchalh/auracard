services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auracard_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - DB_HOST=mysql
    networks:
      - auracard-network
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: auracard_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - auracard-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: auracard_mysql
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-auracard_db}
      MYSQL_USER: ${DB_USERNAME:-auracard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - auracard_mysql_data:/var/lib/mysql
    networks:
      - auracard-network

  redis:
    image: redis:alpine
    container_name: auracard_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - auracard_redis_data:/data
    networks:
      - auracard-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auracard_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
    networks:
      - auracard-network
    depends_on:
      - app
      - mysql
      - redis

networks:
  auracard-network:
    driver: bridge

volumes:
  auracard_mysql_data:
    driver: local
  auracard_redis_data:
    driver: local
