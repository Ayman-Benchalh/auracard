<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
    <defs>
        <linearGradient id="auraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6C5CE7"/>
            <stop offset="50%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="auraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="50%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#6C5CE7"/>
        </linearGradient>
        <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Symbol Group -->
    <g transform="translate(10, 8)">
        <!-- Card Frame -->
        <rect x="6" y="8" width="56" height="48" rx="12" fill="#0F172A" stroke="url(#auraGrad1)" stroke-width="2.5"/>
        
        <!-- Aura Waves -->
        <path d="M16 20 C24 10, 44 10, 52 20" stroke="url(#auraGrad2)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
        
        <!-- Chip Core -->
        <rect x="16" y="26" width="16" height="12" rx="3" fill="url(#auraGrad1)"/>
        
        <!-- NFC Signals -->
        <path d="M40 25 C45 28, 45 36, 40 39" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#auraGlow)"/>
        <path d="M47 21 C54 26, 54 38, 47 43" stroke="url(#auraGrad1)" stroke-width="2.5" stroke-linecap="round"/>
        
        <!-- Center Nexus -->
        <circle cx="34" cy="32" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Typography -->
    <text x="88" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">
        AURA<tspan fill="#818CF8" font-weight="700">CARD</tspan>
    </text>
    <text x="90" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="3">
        SMART NFC IDENTITY
    </text>
</svg>
